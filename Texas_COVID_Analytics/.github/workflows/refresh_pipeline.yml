name: Refresh analytics pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache NYT raw files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nyt-covid-county-2020-2023-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run preprocessing and modeling
        run: |
          python run_pipeline.py

      - name: Commit refreshed dashboard/report outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data reports
          git diff --cached --quiet || git commit -m "Refresh analytics outputs"
          git push

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: texas-covid-analytics-results
          path: |
            reports/
            dashboard_data/
            models/
          retention-days: 14
